<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">Amazon inspired full stack storefront project structure</title>
  <desc id="description">Project tree showing the Node.js server, storefront frontend, product data, package scripts, and README.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263442"/><stop offset="1" stop-color="#111820"/></linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd814"/><stop offset="1" stop-color="#f3a847"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06150f" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="410" rx="24" fill="url(#background)"/>
  <circle cx="1090" cy="55" r="130" fill="#fff" opacity=".035"/><circle cx="1160" cy="365" r="155" fill="#fff" opacity=".035"/>
  <text x="52" y="55" fill="#c4d0d9" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">PROJECT MAP</text>
  <text x="52" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Amazon.in Storefront Demo</text>
  <g filter="url(#shadow)">
    <rect x="48" y="124" width="354" height="240" rx="13" fill="#fff"/><rect x="48" y="124" width="354" height="44" rx="13" fill="#f2f4f5"/><path d="M48 155h354v13H48z" fill="#f2f4f5"/>
    <path d="M66 140h12l5 5h17v14H66z" fill="url(#folder)"/><text x="109" y="153" fill="#202a33" font-family="Arial,sans-serif" font-size="15" font-weight="700">amazon-clone/</text>
    <path d="M81 171v167" stroke="#d6dce0" stroke-width="2"/><g stroke="#c3cbd0" stroke-width="2"><path d="M81 191h17M81 214h17M81 237h17M81 260h17M81 283h17M81 306h17M81 329h17"/></g>
    <g font-family="Arial,sans-serif" font-size="12" fill="#3e4b55">
      <rect x="101" y="181" width="13" height="13" rx="2" fill="#d9e9fb"/><text x="123" y="192">index.html</text>
      <rect x="101" y="204" width="13" height="13" rx="2" fill="#d8eddf"/><text x="123" y="215">style.css</text>
      <rect x="101" y="227" width="13" height="13" rx="2" fill="#f8e6b9"/><text x="105" y="237" fill="#a87616" font-size="8" font-weight="700">JS</text><text x="123" y="238">script.js</text>
      <rect x="101" y="250" width="13" height="13" rx="2" fill="#e6dcf5"/><text x="123" y="261">server.js</text>
      <path d="M101 273h13l3 3v11h-16z" fill="#f7dfba"/><text x="123" y="284">package.json</text>
      <path d="M101 296h13l3 3v11h-16z" fill="#f7dfba"/><text x="123" y="307">data/products.json</text>
      <rect x="101" y="319" width="13" height="13" rx="2" fill="#f5d9d1"/><text x="123" y="330">amazon_logo.png · README.md</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="426" y="124" width="326" height="240" rx="13" fill="#fff"/><rect x="426" y="124" width="326" height="44" rx="13" fill="#f2f4f5"/><path d="M426 155h326v13H426z" fill="#f2f4f5"/>
    <path d="M445 140h12l5 5h17v14h-34z" fill="url(#folder)"/><text x="488" y="153" fill="#202a33" font-family="Arial,sans-serif" font-size="15" font-weight="700">data/</text>
    <rect x="450" y="190" width="272" height="65" rx="8" fill="#f5f7f8"/><path d="M466 207h13l5 5v25h-18z" fill="#f7dfba"/><text x="495" y="215" fill="#34434d" font-family="Arial,sans-serif" font-size="12" font-weight="700">products.json</text><text x="495" y="234" fill="#6a777f" font-family="Arial,sans-serif" font-size="10">Sample catalog used by the API</text>
    <rect x="450" y="268" width="272" height="65" rx="8" fill="#f5f7f8"/><ellipse cx="474" cy="288" rx="11" ry="5" fill="#a9c3d9"/><path d="M463 288v21c0 3 22 3 22 0v-21" fill="#d7e6f1" stroke="#8aaec8"/><ellipse cx="474" cy="309" rx="11" ry="5" fill="#c1d5e5"/><text x="495" y="293" fill="#34434d" font-family="Arial,sans-serif" font-size="12" font-weight="700">storefront.sqlite</text><text x="495" y="312" fill="#6a777f" font-family="Arial,sans-serif" font-size="10">Created on first server start</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="776" y="124" width="376" height="240" rx="13" fill="#fff"/><text x="801" y="157" fill="#202a33" font-family="Arial,sans-serif" font-size="15" font-weight="700">How the app works</text>
    <circle cx="808" cy="194" r="5" fill="#f3a847"/><text x="825" y="198" fill="#53616a" font-family="Arial,sans-serif" font-size="11">HTML + CSS render the shop</text>
    <circle cx="808" cy="227" r="5" fill="#6c9fc5"/><text x="825" y="231" fill="#53616a" font-family="Arial,sans-serif" font-size="11">JavaScript calls the REST API</text>
    <circle cx="808" cy="260" r="5" fill="#5c9d76"/><text x="825" y="264" fill="#53616a" font-family="Arial,sans-serif" font-size="11">Node.js serves UI and catalog endpoints</text>
    <circle cx="808" cy="293" r="5" fill="#9175bf"/><text x="825" y="297" fill="#53616a" font-family="Arial,sans-serif" font-size="11">SQLite stores carts and demo orders</text>
    <path d="M801 320h326" stroke="#e2e6e8"/><text x="801" y="343" fill="#7b878e" font-family="Arial,sans-serif" font-size="10">One local command starts both frontend and backend.</text>
  </g>
</svg>
